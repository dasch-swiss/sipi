# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

# Coverage gap: production Rust crates (declared via `crate.spec()` / resolved
# by `crate.from_specs()` in MODULE.bazel — no Cargo.toml/Cargo.lock for
# Dependabot to parse) and native-dep `http_archive` pins (libtiff, exiv2,
# lcms2, jansson, jbigkit, Kakadu; see CLAUDE.md's Dependencies table) are NOT
# covered by any `cargo` or `bazel` entry below. The `cargo` entry only
# reaches `/test/e2e`'s own manifest. Vulnerability coverage for the
# production `@crates` hub comes from `just audit` (cargo-audit + OSV-Scanner
# over the checked-in `Cargo.Bazel.lock`, CI job `dependency-audit` in
# ci.yml). Native-dep pins have no automated advisory feed — see the
# "Quarterly native-pin review" checklist in
# docs/src/development/ci.md.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      github-actions-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      nix-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "cargo"
    directory: "/test/e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      backend-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # These are peer deps of Cargo and should not be automatically bumped
      - dependency-name: "semver"
      - dependency-name: "crates-io"
      # Ignore major updates for all dependencies
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bazel"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      bazel-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
    ignore:
      # Majors require manual review against MODULE.bazel's override comments
      # (rules_go / rules_android floors driven by protobuf 34.1, BCR repacks).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
