name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # Job 1: Dedicated code review with a predefined prompt, triggered by '@claude review' on a PR.
  #
  # Split out of the former single 'claude' job so the review can be given a tight, validated
  # tool set without also constraining the general assistant, which legitimately needs to write
  # code. Before the split the two shared one job, so any tool decision was a trade-off between
  # them: leave the tools open and the review cannot be pinned to what was benchmarked; close
  # them and '@claude <prompt>' loses the ability to edit files.
  #
  # Both jobs gate on author_association (DEV-6884): comment-triggered workflows always run
  # from the default branch with secrets available, and "Require approval for all external
  # contributors" gates only fork pull_request events — not comment events — so without this
  # gate any GitHub account able to comment could spend the org's API key. CONTRIBUTOR is
  # deliberately outside the allowlist; a member can trigger on an outside contributor's
  # behalf. A blocked trigger skips silently, like a non-matching comment.
  claude-code-review:
    if: |
      (github.event.issue.pull_request || github.event.pull_request) &&
      (contains(github.event.comment.body, '@claude review') || contains(github.event.review.body, '@claude review')) &&
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    # 30, not 15: a review that is killed mid-run yields nothing at all, because the action
    # writes its result only at the end. A generous ceiling costs nothing on runs that finish
    # early — measured review runs land well inside it.
    timeout-minutes: 30
    # Least privilege for the review: it reads the diff and posts a review. It does not need
    # 'contents: write' or 'issues: write', which the shared job carried for the assistant's
    # sake. 'actions: read' stays because the prompt checks whether the sanitizer job failed.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: "true"
          include_fix_links: "false"
          additional_permissions: |
            actions: read
          # --model / --effort / --allowed-tools: from the 2026-08 review benchmark — 157 runs
          # against 15 commits with known answers in dsp-api and dsp-app. Aligned with the list
          # validated there, because what a review has to execute is language-independent:
          # read the diff, read the changed files in full, search the repo, fetch an external
          # specification, post the review.
          #
          # Model: on the six phase-1 cells (two planted bugs x three prompts) Opus 5 fully
          # caught five and partially caught one, with zero blocking false positives, while
          # Opus 4.8 fully caught none -- two partial, four missed. Per-token pricing is
          # identical across Opus 5/4.8/4.7/4.6 ($5 in / $25 out per MTok), so this is not a
          # cost-for-quality trade on rate.
          # claude-opus-4-6 is a generation older than the arm that fully caught nothing.
          # Effort: medium — detection was identical to high on all nine commits run at both,
          # high's only distinguishing behaviour was holding one clean diff on a real but
          # non-blocking finding, and medium is ~16% cheaper.
          #
          # --allowed-tools is the complete resolved set; the action adds nothing to it, so
          # Read must be granted explicitly or the prompt's "read the changed files in full"
          # cannot be honoured. WebFetch/WebSearch are what make the external-verification
          # clause executable — the clause that took one bug class from 16 straight misses to
          # 2 of 2, and the reason it matters here is that this server's own 400 responses are
          # exactly the kind of precondition it exists to check.
          #
          # Three additions beyond the dsp-api list, both required by this repo's prompt:
          # 'gh api' / 'gh pr review' to submit a single inline review, and 'gh run' to read
          # sanitizer CI status.
          #
          # --setting-sources user: do NOT load this repo's own .claude/settings.json. That
          # file is a local-developer convenience list — it grants docker run, gcloud, gcc,
          # g++, find and grep — and the action would otherwise union it into this job's
          # permissions. The review's tool set is defined on this line and nowhere else.
          claude_args: '--model claude-opus-5 --effort medium --setting-sources user --allowed-tools "Read,Grep,Glob,WebSearch,WebFetch,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh api:*),Bash(gh pr review:*),Bash(gh run list:*),Bash(gh run view:*)"'
          prompt: |
            Perform a thorough code review of this pull request following the project's
            REVIEW.md checklist. Read REVIEW.md from the repository root first, then review
            every changed file against each applicable section. Honour its "Skip" section —
            do not spend the run on what it tells you to skip.

            Report issues only in lines this PR changed — but read whatever you need to
            decide whether an issue is real: the changed files in full (diff hunks alone
            give too little context), their callers, their tests, and neighbouring
            implementations of the same pattern. Reading widely is fine; reporting
            widely is not.

            Before reporting an issue, name the concrete input or state that triggers it
            and the wrong output, crash, or regression that results. Drop any issue where
            you cannot; where the justification is only "more robust" or "best practice";
            or where a code comment explains it as a deliberate decision (read the comments
            before flagging). If you checked a concern and could not prove it but still
            believe it matters, report it as Suspected rather than dropping it or inflating
            its severity. A few defensible issues beat many speculative ones, and reporting
            no issues at all is a valid and useful outcome.

            Do not assert how a library, a C API or an external service behaves from memory
            — in either direction. When the diff constructs or parses a value that some
            other system interprets (an IIIF size, region or rotation parameter, a URL, a
            path template, an image-format header, a media-type string), you must check the
            constructed form against that system's own specification before you either
            report it or clear it. Well-formed is not the same as accepted: a form can be
            valid syntax, and listed as supported by the receiving system, and still be
            rejected at runtime because of a precondition attached to that form — a
            permitted value range, a limit that depends on the input data rather than on the
            string, a flag that must be present for the operation to be allowed. So do not
            stop at "the syntax is valid" or "the server supports this feature": find the
            preconditions the specification attaches to the form you built, and for each one
            name the input that would violate it or state why none can. Confirm against the
            versions this repo builds with (`MODULE.bazel`) or the specification itself via
            web search. If you cannot complete that check, say so explicitly and grade the
            line Suspected — do not declare it correct.

            Classify each finding as **Blocking** or **Non-blocking**. This is independent
            of how bad the outcome is, and independent of which REVIEW.md section it came
            from:
            - Blocking: you established, from the code or an authoritative external source,
              that a reachable input or state produces a wrong outcome — memory unsafety, an
              error or crash on a normal path, incorrect bytes or dimensions written or
              returned, access incorrectly granted or denied, or a deterministic CI failure.
              "Reachable" means you can name the input. It does not require the feature to
              stop working, and it does not require the outcome to be severe.
            - Non-blocking: everything else — style, naming, missing tests, performance that
              is not a regression, and anything you could not verify.
            - Suspected: a concern you could not prove. Always Non-blocking. State what
              would confirm or refute it.

            Separately, grade impact High, Medium or Low, for triage ordering only. Impact
            never determines Blocking.

            Post your findings as inline PR review comments on the specific lines where
            issues are found. Use GitHub's review API to submit a single review with all
            comments (not individual comments). For each finding give the trigger and wrong
            outcome you named above, how you verified the mechanism, and a suggested fix.

            Submit that single review as:
            - Request changes — if any finding is Blocking.
            - Comment — if there are findings but none of them is Blocking.
            - Approve — if no issues were found.

            Do not override this in prose: if you find yourself arguing that a Non-blocking
            issue should hold the PR, it is Blocking; re-mark it.

            Pay special attention to the "C library boundary safety (FFI)" and
            "Multi-buffer dimension safety" sections — these catch the class of
            bugs that sanitizers find at runtime.

            Also check CI status — if the sanitizer workflow failed, include its findings
            in your review.

  # Job 2: General Claude assistant (flexible), triggered by '@claude <PROMPT>' on PRs, issues etc.
  # The negated clause is exactly job 1's condition, so the two jobs are mutually exclusive by
  # construction, while '@claude review' on a plain issue — where job 1 cannot run — still lands
  # here. Deliberately keeps the write permissions, the full-history checkout and an unrestricted
  # tool set: this is the arm people use to change code, and none of the benchmark's findings
  # are about it. Only the model is updated.
  claude-general:
    # The allowlist check sits inside each trigger arm: issue_comment payloads also carry
    # issue.author_association, so a single AND-ed check across the arms would pass a
    # stranger's comment on any issue or PR a member opened.
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'assigned') && contains(github.event.issue.body, '@claude') &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
      ) &&
      !(
        (github.event.issue.pull_request || github.event.pull_request) &&
        (contains(github.event.comment.body, '@claude review') || contains(github.event.review.body, '@claude review'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-opus-5"
          track_progress: "true"
          include_fix_links: "false"
          additional_permissions: |
            actions: read
