# OSV-Scanner ignore list for the `just audit` CI gate (see the `audit` recipe
# in the justfile). Entries here suppress advisories that have no upstream fix
# and are provably unreachable in SIPI; each must carry a reason and be revisited
# when a fix ships.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
reason = "rsa Marvin timing side-channel; no fixed upstream release. `rsa` is a transitive dependency of `jsonwebtoken` (RS256/PS256 support only); SIPI pins JWT to HS256, so no RSA private-key operation is ever performed and the side-channel is unreachable. Revisit when `rsa` ships a fixed release."

[[IgnoredVulns]]
id = "GHSA-w9wp-h8wv-79jx"
reason = "opentelemetry_sdk unbounded-allocation DoS in the W3C Baggage propagator (extract_with_context on oversized inbound `baggage` headers); fixed in 0.32.1. Unreachable in SIPI: telemetry.rs installs TraceContextPropagator only (no BaggagePropagator, no composite), so inbound baggage headers are never parsed. Ignored pending the coordinated opentelemetry* 0.31→0.32 lockstep bump (tracked as a follow-up), not blocking on it because the vulnerable path cannot execute."
